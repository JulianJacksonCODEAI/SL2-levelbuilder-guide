name: Privacy check
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for keys and tokens
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /repo --redact --verbose --exit-code 1
  private-info:
    name: Private CodeAI information
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Scan for internal links, emails and private names
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: python scripts/privacy_scan.py
