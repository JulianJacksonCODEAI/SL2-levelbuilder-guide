[project]
site_name = "Sprite Lab 2 Level Builder Guide"
site_url = "https://julianjacksoncodeai.github.io/SL2-levelbuilder-guide/"
site_description = "How to build Sprite Lab 2 (Lab2) levels in Code.org Level Builder."
edit_uri = "edit/main/docs/"
repo_url = "https://github.com/JulianJacksonCODEAI/SL2-levelbuilder-guide"
repo_name = "SL2-levelbuilder-guide"
# Change the ?v= date whenever extra.css or block-filter.js changes, so browsers fetch the new copy.
extra_css = ["stylesheets/extra.css?v=2026-11-26"]
extra_javascript = ["javascripts/block-filter.js?v=2026-11-26"]
nav = [
  { "Home" = "index.md" },
  { "How-to" = [
    { "Make a level" = "make-a-level.md" },
    { "Level modes" = "level-modes.md" },
    { "Starter code and toolbox" = "starter-code-and-toolbox.md" },
    { "Images tab and AI image creator" = "image-generator.md" },
    { "Checklists (objectives)" = "checklists.md" },
    { "Setup tricks" = "setup-tricks.md" },
    { "Lock a function" = "lock-a-function.md" },
    { "Create new blocks" = "create-new-blocks.md" },
  ] },
  { "Reference" = [
    { "JSON properties" = "reference/json-properties.md" },
    { "Console recipes" = "reference/console-recipes.md" },
    { "Blocks" = "reference/blocks.md" },
    { "AI blocks" = "reference/ai-blocks.md" },
    { "Limits and changes" = "reference/known-bugs.md" },
  ] },
]

[project.theme]
language = "en"
logo = "images/brand/codeai-logo-white.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
